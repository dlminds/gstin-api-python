[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gstin-toolkit"
dynamic = ["version"]
description = "GSTIN validation and GST number verification for Python — offline checksum validation plus a client for the gstinapi.com GST verification API."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "GSTIN API", email = "support@gstinapi.com" }]
maintainers = [{ name = "GSTIN API", email = "support@gstinapi.com" }]
keywords = [
    "gstin",
    "gst",
    "gstin-validation",
    "gstin-verification",
    "gst-api",
    "gstin-api",
    "gst-verification",
    "gst-number",
    "gst-search",
    "india",
    "tax",
    "compliance",
    "pan",
    "e-invoice",
    "invoice",
    "gstr",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Office/Business :: Financial :: Accounting",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://gstinapi.com"
Documentation = "https://gstinapi.com/docs"
"API reference" = "https://github.com/dlminds/gstin-api-python/blob/main/docs/api-reference.md"
"Checksum algorithm" = "https://github.com/dlminds/gstin-api-python/blob/main/docs/gstin-checksum-algorithm.md"
Source = "https://github.com/dlminds/gstin-api-python"
Issues = "https://github.com/dlminds/gstin-api-python/issues"
Changelog = "https://github.com/dlminds/gstin-api-python/blob/main/CHANGELOG.md"

[project.scripts]
gstin-api = "gstin_api.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0", "mypy>=1.5", "ruff>=0.5"]

[tool.hatch.version]
path = "src/gstin_api/_version.py"

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/docs", "/README.md", "/LICENSE", "/CHANGELOG.md"]

[tool.hatch.build.targets.wheel]
packages = ["src/gstin_api"]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = "--doctest-modules --strict-markers"

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "E501",   # long lines are formatted by hand here, not wrapped by a tool
    "RUF001", # en dashes in user-facing strings are deliberate and match the API
    "RUF002",
    "RUF003",
    "RUF022", # __all__ is grouped by layer, which is more useful than sorted
    "RUF023",
]

[tool.mypy]
strict = true
files = ["src/gstin_api"]
